<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 170 1180 970" role="img" aria-label="Tocker">
  <defs>
    <!-- The T: a slanted left arm, a V notch, a right arm that bends into the stem, and a stem with an angled foot. -->
    <path id="t" d="M76 204 H556 L563 386 L716 236 Q752 204 842 204 H1180 L1030 381 H802 Q727 381 727 458 V1110 L495 938 V381 H229 Z"/>
    <clipPath id="clip"><use href="#t"/></clipPath>
    <linearGradient id="edge" x1="80" y1="200" x2="1180" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FD2FF"/>
      <stop offset="0.32" stop-color="#2F5BFF"/>
      <stop offset="0.55" stop-color="#FF2BD6"/>
      <stop offset="0.78" stop-color="#3F7BFF"/>
      <stop offset="1" stop-color="#FF3DB4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121c"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="streakBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F5BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3D7BFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2F5BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF3DDA" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <use href="#t" fill="url(#body)" stroke="url(#edge)" stroke-width="46" stroke-linejoin="round"/>
  <!-- Light streaks crossing the glass, clipped to the T. -->

  <use href="#t" fill="none" stroke="url(#edge)" stroke-width="46" stroke-linejoin="round" paint-order="stroke"/>
</svg>
