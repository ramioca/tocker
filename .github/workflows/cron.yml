# Free alternative to Vercel Cron (Hobby plans are limited to once-daily schedules).
# Set repo secrets: APP_URL (https://tocker.xyz) and CRON_SECRET.
#
# The run commands are block scalars on purpose: an unquoted `Authorization: Bearer`
# on a `run:` line is a YAML mapping to the parser, and the whole workflow fails at
# startup — silently, since a scheduled workflow that never parses never runs.
name: tocker cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Mark positions and run the exit engine
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/marks" | head -c 400
      # Always: the two loops are independent, and a marks pass that 500s or times out
      # must not also stop every agent from thinking. The reverse ordering is deliberate
      # (exits before new positions), not a dependency.
      - name: Run agents that are due
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick" | head -c 400
