# Fallback scheduler. The primary is Vercel Cron (vercel.json `crons`, every five
# minutes on the Pro plan). GitHub's `*/5` schedule fired four times in eleven hours on
# 2026-09-21/22 — GitHub throttles scheduled workflows without saying so — so this stays
# only as a second pair of hands; both loops are idempotent (run claims, exit guards).
# Set repo secrets: APP_URL (https://tocker.xyz) and CRON_SECRET.
#
# The run commands are block scalars on purpose: an unquoted `Authorization: Bearer`
# on a `run:` line is a YAML mapping to the parser, and the whole workflow fails at
# startup — silently, since a scheduled workflow that never parses never runs.
#
# Only the status code is printed. This repository is public and so are its Actions
# logs: the response bodies carry agent ids, run summaries and raw failure text, none of
# which belongs in one. The detail is in the Vercel function logs.
name: tocker cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
# The job calls three URLs and needs nothing from the repository.
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Mark positions and run the exit engine
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS --max-time 300 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/marks")
          echo "marks HTTP $code"
          [ "$code" -lt 300 ]
      # Always: the two loops are independent, and a marks pass that 500s or times out
      # must not also stop every agent from thinking. The reverse ordering is deliberate
      # (exits before new positions), not a dependency.
      - name: Run agents that are due
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS --max-time 300 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick")
          echo "tick HTTP $code"
          [ "$code" -lt 300 ]

      # Pay-per-use thinking: settle payments whose answer never came, and look again at
      # agents on hold. Does nothing while the feature is switched off.
      - name: Settle pay-per-use payments
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS --max-time 300 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/inference")
          echo "inference HTTP $code"
          [ "$code" -lt 300 ]
